name: Adjust Karaca icons for light and dark themes

on:
  push:
    branches: [feature/karaca-connect-brand]
    paths: [.github/workflows/adjust-karaca-icons.yml]

permissions:
  contents: write

jobs:
  adjust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/karaca-connect-brand
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install Pillow
      - name: Create light and dark theme variants
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          path = Path("core_integrations/karaca_connect")
          for size, suffix in ((256, ""), (512, "@2x")):
              source = Image.open(path / f"icon{suffix}.png").convert("RGBA")
              if source.size != (size, size):
                  raise ValueError(f"Unexpected icon dimensions: {source.size}")
              source.save(path / f"dark_icon{suffix}.png", optimize=True)
              pixels = source.load()
              for y in range(size):
                  for x in range(size):
                      r, g, b, a = pixels[x, y]
                      pixels[x, y] = (35, 40, 48, a)
              source.save(path / f"icon{suffix}.png", optimize=True)
          PY
      - name: Commit updated theme assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core_integrations/karaca_connect/icon.png core_integrations/karaca_connect/icon@2x.png core_integrations/karaca_connect/dark_icon.png core_integrations/karaca_connect/dark_icon@2x.png
          git diff --cached --quiet || git commit -m "assets: provide visible Karaca icons for light and dark themes"
          git push origin HEAD:feature/karaca-connect-brand
